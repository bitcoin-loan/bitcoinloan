<!DOCTYPE html>
<html>
<head>
  <title>QuickBTC Login</title>
  <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body style="background:#0f172a; color:white;">

<div class="container" style="padding:50px;">

  <h1>Login to QuickBTC</h1>

  <input id="email" type="email" placeholder="Email" class="form-control"><br>

  <input id="password" type="password" placeholder="Password" class="form-control"><br>

  <button class="btn btn-primary" onclick="login()">Login</button>

  <p id="msg"></p>
  
  <p style="margin-top:15px;">
  Don’t have an account?
</p>

<a href="register.html" class="btn btn-outline-light">
  Create Account
</a>

</div>
<script src="https://unpkg.com/@nhost/nhost-js"></script>
  <script>
const nhost = new Nhost.NhostClient({
  subdomain: "YOUR_SUBDOMAIN",
  region: "YOUR_REGION"
});
  </script>
  
 <script>
async function login() {

  const email = document.getElementById("email")?.value;
  const password = document.getElementById("password")?.value;
  const msg = document.getElementById("msg");

  if (!email || !password) {
    msg.innerText = "Enter email and password";
    return;
  }

  msg.innerText = "Logging in...";

  const { session, error } = await nhost.auth.signIn({
    email: email,
    password: password
  });

  if (error) {
    msg.innerText = error.message;
  } else {
    msg.innerText = "Login successful";

    console.log(session);

    // Redirect to dashboard
    window.location.href = "dashboard.html";
  }
}
  </script>
  <script>
if (nhost.auth.isAuthenticated()) {
  window.location.href = "dashboard.html";
}
  </script>
  
</body>
</html>
