<!DOCTYPE html>
<html>
<head>
  <title>QuickBTC Register</title>
  <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body style="background:#0f172a; color:white;">

<div class="container" style="padding:50px;">

  <h1>Create Account</h1>

  <input id="name" placeholder="Full Name" class="form-control"><br>

  <input id="email" placeholder="Email" class="form-control"><br>

  <input id="password" type="password" placeholder="Password" class="form-control"><br>

  <button class="btn btn-success" onclick="register()">Register</button>
  <p style="margin-top:15px;">
  Already have an account?
</p>

<a href="login.html" class="btn btn-outline-light">
   Login
</a>

</div>
<script src="https://unpkg.com/@nhost/nhost-js"></script>

<script>
const nhost = new Nhost.NhostClient({
  subdomain: "YOUR_SUBDOMAIN",
  region: "YOUR_REGION"
});
</script>
<script>
async function register() {

  const name = document.getElementById("name")?.value;
  const email = document.getElementById("email")?.value;
  const password = document.getElementById("password")?.value;

  if (!email || !password) {
    alert("Email and password required");
    return;
  }

  const { session, error } = await nhost.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Registration successful");

    console.log(session);

    // Optional: redirect
    window.location.href = "login.html";
  }
}
    </script>
</body>
</html>
