<!DOCTYPE html>
<html>
<head>
  <title>QuickBTC Register</title>
  <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body style="background:#0f172a; color:white;">

<div class="container" style="padding:50px;">

  <h1>Create Account</h1>

  <input id="name" placeholder="Full Name" class="form-control"><br>

  <input id="email" placeholder="Email" class="form-control"><br>

  <input id="password" type="password" placeholder="Password" class="form-control"><br>

  <button class="btn btn-success" onclick="register()">Register</button>
  <p style="margin-top:15px;">
  Already have an account?
</p>

<a href="login.html" class="btn btn-outline-light">
   Login
</a>

</div>
<script src="https://cdn.jsdelivr.net/npm/@nhost/nhost-js@latest/dist/index.umd.js"></script>

<script>
const nhost = window.nhost.createClient({
  subdomain: "bodsydvasrwtlkghfyig",
  region: "us-west-2"
});
console.log("NHOST:", nhost);
</script>
<script>
async function register() {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Email and password required");
    return;
  }

  try {

    const { error, session, user } = await nhost.auth.signUp({
  email,
  password,
  options: {
    displayName: name
  }
});

if (error) {
  alert(error.message);
  return;
}

alert("Check your email to verify account.");
window.location.href = "login.html";

  } catch (err) {
    console.error(err);
    alert("Unexpected error occurred.");
  }
}
</script>
</body>
</html>
